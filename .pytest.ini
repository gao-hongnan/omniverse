# Reference:
# https://github.com/tiangolo/fastapi/blob/master/pyproject.toml
# https://github.com/pydantic/pydantic/blob/main/pyproject.toml
[pytest]
minversion=8.0
pythonpath=.
addopts=
    -ra
    --strict-config
    --strict-markers
    --import-mode=importlib
testpaths=
    tests/omnivault/unit
xfail_strict=true
asyncio_default_fixture_loop_scope=function
filterwarnings=
    error
    # pytest-asyncio 0.25.0 calls asyncio.get_event_loop_policy()/set_event_loop_policy(),
    # both deprecated on Python 3.14 (removal slated for 3.16); remove once pytest-asyncio
    # is upgraded to a release that no longer touches the policy system.
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio.*
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio.*
markers =
    asyncio: mark test as an async test
