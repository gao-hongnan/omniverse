name: Release

on:
  push:
    tags:
      - "v*.*.*"  # Trigger on version tags
  workflow_dispatch:  # Allow manual triggering

# Ensure only one release runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  # Run CI checks before releasing
  ci:
    uses: ./.github/workflows/ci_omnivault.yaml

  # Build distribution packages
  build:
    name: Build distribution 📦
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Build package
        run: |
          uv build --no-sources
          ls -la dist/

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # Publish to TestPyPI first
  publish-testpypi:
    name: Publish to TestPyPI 🧪
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/omniverse
    permissions:
      id-token: write  # IMPORTANT: Required for trusted publishing
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_URL: https://test.pypi.org/legacy/
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}  # Fallback if trusted publishing not configured
        run: |
          # Try with trusted publishing first, fallback to token if needed
          uv publish dist/* --publish-url https://test.pypi.org/legacy/ || \
          uv publish dist/* --publish-url https://test.pypi.org/legacy/ --token $UV_PUBLISH_TOKEN

  # Test installation from TestPyPI
  test-install:
    name: Test installation 🔧
    needs: publish-testpypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test installation from TestPyPI
        run: |
          # Create a test environment and install from TestPyPI
          uv venv test-env
          uv pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ omniverse
          uv run --no-project python -c "import omnivault; print(f'Successfully imported omnivault {omnivault.__version__}')"

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI 🚀
    needs: test-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omniverse
    permissions:
      id-token: write  # IMPORTANT: Required for trusted publishing
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        run: uv publish dist/*

  # Create GitHub Release
  github-release:
    name: Create GitHub Release 📋
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      id-token: write  # Required for sigstore signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install commitizen

      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate release notes
        id: changelog
        run: |
          # Get the current and previous tags
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${CURRENT_TAG}^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, this is the first release"
            CHANGELOG="Initial release of Omniverse"
          else
            # Generate changelog using commitizen
            CHANGELOG=$(uv run cz changelog --dry-run $PREVIOUS_TAG..$CURRENT_TAG || echo "See commit history for changes")
          fi

          # Write to file for release body
          cat > release_notes.md << EOF
          ## What's Changed

          $CHANGELOG

          ## Installation

          \`\`\`bash
          pip install omniverse==$CURRENT_TAG
          \`\`\`

          Or with uv:

          \`\`\`bash
          uv pip install omniverse==$CURRENT_TAG
          \`\`\`

          ## Full Changelog

          ${PREVIOUS_TAG:+https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}}
          EOF

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      - name: Sign distribution packages with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.changelog.outputs.current_tag }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ steps.changelog.outputs.current_tag }}" \
            --notes-file release_notes.md \
            --verify-tag

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.changelog.outputs.current_tag }} \
            dist/* \
            --repo ${{ github.repository }}

  # Optional: Build and push Docker images
  docker-release:
    name: Build and push Docker images 🐳
    needs: publish-pypi
    if: success()
    uses: ./.github/workflows/release_docker.yaml
    secrets: inherit