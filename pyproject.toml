[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniverse"
version = "0.0.63"
description = "A collection of code for Omniverse."
authors = [{name="GAO Hongnan", email="hongnangao@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "hydra-core==1.3.2",
    "jupyter-server>=2.16.0",
    "matplotlib>=3.10",
    "numpy>=2.1",
    "openai>=1.1.1",
    "pandas>=2.1.1",
    "plotly>=6.3.0",
    "portalocker>=2.8.2",
    "psutil>=6.0.0",
    "pydantic>=2.5.2",
    "rich>=13.6.0",
    "scikit-learn>=1.6",
    "seaborn>=0.13.0",
    "tiktoken>=0.12",
    "torch>=2.9",
    "torchmetrics>=1.4",
    "torchinfo>=1.8.0",
    "torchvision>=0.16.0",
    "reproducibility",
]

[project.urls]
Homepage = "https://github.com/gao-hongnan/omniverse"
Issues = "https://github.com/gao-hongnan/omniverse/issues"

[project.optional-dependencies]
serving = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gunicorn>=23",
    "Faker>=30",
    "sqlmodel>=0.0.22",
    "SQLAlchemy>=2.0.36",
    "pydantic>=2.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["omnivault"]

[dependency-groups]
lint = [
    "bandit>=1.8",
    "prek==0.4.11",
    "commitizen==4.17.0",
    "ruff==0.16.1",
]

type = [
    "mypy>=1.16",
    "pandas-stubs==2.1.4.231227",
    "types-psutil==6.0.0.20240621",
    "types-requests==2.31.0.10",
    "types-tabulate==0.9.0.20240106",
    "types-tqdm==4.66.0.5",
    "types-PyYAML==6.0.12.20240917",
    "ty==0.0.65",
    "pyrefly==1.2.0",
    "pyright==1.1.411",
]

test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "coverage==7.3.2",
    "typeguard==4.1.5",
    "colorama==0.4.6",
]

docs = [
    "jupyter-book>=1.0.0,<2.0.0",
    "transformers",
    "datasets",
    "statsmodels",
    "opencv-python-headless",
    "sphinx-inline-tabs",
    "sphinx-proof",
    "sphinx-sitemap",
    "sphinx-reredirects",
    "sphinxext-opengraph[social-cards]",
    "sphinxcontrib-mermaid",
    "ghp-import",
    "ipywidgets",
]

dev = [
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "test" },
    { include-group = "docs" },
]

[tool.bandit]
exclude_dirs = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    "venv_*",
    "venv",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
